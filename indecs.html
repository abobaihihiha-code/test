<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>JoJo Business Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="jojo-card">

    <!-- Фото персонажа -->
    <div class="avatar">
        <img src="photo.jpg" alt="Avatar">
    </div>

    <div class="badges">
        <span class="badge sp">АЛАХ ТАК СКАЗАВ</span>
        <span class="badge ora">МЕНЕ 1636286 ГОДІКІВ</span>
    </div>

    <div class="main-info">
        <h1 class="name">МУХАМЕД АБАЮДНАВІЧ</h1>
        <h2 class="role">МОЖУ СКАЗАТИ АЛАХ БАБАХ</h2>

        <div class="info-field">
            <span class="icon">⚡</span> +380 88 833 35
        </div>
        <div class="info-field">
            <span class="icon">★</span> jojo@example.com
        </div>
        <div class="info-field">
            <span class="icon">⚡</span> www.jojo-stand.jp
        </div>
    </div>

</div>

</body>
</html>
